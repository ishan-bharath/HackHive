[project]
name = "hackhive-ps4"
version = "2.0.0"
description = "Joint hub placement and closed-ring cable routing on ResPlan floor plans (PS4)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = false
source = ["hackhive_ps4"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "archive",
    "dataset",
    # legacy prototype/diagnostic scripts (moved to archive/ in the cleanup pass)
    "audit_multiple_plans.py", "audit_passages.py", "cable_router.py",
    "calibrate_areas.py", "candidate_passage_detector.py",
    "connector_association.py", "connector_edge_reconciliation.py",
    "debug_x.py", "diagnose_areas.py", "diagnose_portals.py",
    "inspect_doorway_geometry.py", "inspect_opening_boundaries.py",
    "module1_portal_and_calibration.py", "obstacle_router.py",
    "passage_constrained_router.py", "passage_geometry_audit.py",
    "passage_loop_audit.py", "passage_validator.py",
    "portal_cable_router.py", "portal_extractor.py",
    "portal_geometry_test.py", "portal_route_planner.py",
    "verify_module2.py", "visual_passage_review.py",
    "visualize_door_candidates.py", "visualize_kitchen_gap.py",
    "visualize_passages.py",
]

[tool.ruff.lint]
# Lenient first pass: real errors only + basic pyflakes; style rules come later.
select = ["E9", "F", "W"]
ignore = [
    "E402",  # module import not at top of file (relocated code keeps its shape)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
no_strict_optional = true
warn_unused_ignores = false
exclude = ["archive", "tests", "dataset"]