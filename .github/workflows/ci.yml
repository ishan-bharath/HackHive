name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff, lenient first pass)
        run: ruff check .

      - name: Type check (mypy, lenient first pass)
        run: mypy hackhive_ps4

      - name: Tests (pytest + coverage)
        run: pytest --cov=hackhive_ps4 --cov-report=term-missing

      - name: Smoke run (3 synthetic plans + axis-alignment gate)
        run: python scripts/smoke_ci.py