name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest began rolling out Ubuntu 26.04 on 2026-10-19; pin 24.04
    # until the migration settles (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff, lenient first pass)
        run: ruff check .

      - name: Type check (mypy, lenient first pass)
        run: mypy hackhive_ps4

      - name: Tests (pytest + coverage)
        run: python -m pytest --cov=hackhive_ps4 --cov-report=term-missing

      - name: Smoke run (3 synthetic plans + axis-alignment gate)
        run: python scripts/smoke_ci.py